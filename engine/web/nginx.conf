server {
    listen 80;
    charset utf-8;
    root /usr/share/nginx/html;
    index tracker.html;

    # Trang tracker
    location = / { try_files /tracker.html =404; }
    location / { try_files $uri $uri/ /tracker.html; }

    # Proxy API tai video (tranh loi CORS)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    # Gallery xem video theo user
    location /gallery/ {
        proxy_pass http://gallery:8001/;
        proxy_set_header Host $host;
    }

    # Duyet file da tai (trang dep, du lieu tu gallery API)
    location = /files { rewrite ^ /files/ last; }
    location /files/ {
        alias /usr/share/nginx/html/;
        try_files /files.html =404;
    }
}
